<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>饼控悬浮窗</title>
<style>
:root {
  --accent: #FFB340; --accent-2: #FF7A00;
  --green: #30D158; --green-2: #7BE495;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: transparent;
  color: #F2F2F5;
  overflow: hidden;
  user-select: none; -webkit-user-select: none;
  position: relative;
}
.win {
  position: absolute; inset: 0;
  border-radius: 16px;
  background: linear-gradient(165deg, rgba(26,26,32,.92), rgba(15,15,19,.95));
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,.09);
  box-shadow: 0 12px 40px rgba(0,0,0,.5);
  display: flex; flex-direction: column; justify-content: center;
  gap: 4px; padding: 10px 16px 12px;
  overflow: hidden;
  animation: fadeIn .35s ease;
  app-region: drag; -webkit-app-region: drag;
}
@keyframes fadeIn { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
.win::before {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(220px 120px at 12% -35%, rgba(255,150,40,.18), transparent 65%);
}
body.break .win::before {
  background: radial-gradient(220px 120px at 12% -35%, rgba(48,209,88,.16), transparent 65%);
}
.track { position: absolute; top: 0; left: 0; right: 0; height: 3px; background: rgba(255,255,255,.08); }
.track i {
  display: block; height: 100%; width: 0;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  transition: width .5s linear;
}
body.break .track i { background: linear-gradient(90deg, var(--green-2), var(--green)); }
.task-row { position: relative; display: flex; align-items: center; gap: 6px; min-height: 20px; }
#taskText {
  font-size: 11px; color: #B9B9C0;
  flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
#taskText.empty { color: #6A6A72; }
#dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: #FF453A; flex-shrink: 0;
  box-shadow: 0 0 6px currentColor;
  transition: background .3s;
  app-region: no-drag; -webkit-app-region: no-drag;
}

/* ---------- 浅色主题（跟随主窗口） ---------- */
body[data-theme="light"] .win {
  background: linear-gradient(165deg, rgba(255,255,255,.9), rgba(244,241,236,.94));
  border-color: rgba(60,50,40,.1);
  box-shadow: 0 12px 40px rgba(120,90,50,.2);
}
body[data-theme="light"] .win::before {
  background: radial-gradient(220px 120px at 12% -35%, rgba(255,150,40,.2), transparent 65%);
}
body[data-theme="light"] #taskText { color: #7A756E; }
body[data-theme="light"] .track { background: rgba(0,0,0,.09); }
body[data-theme="light"] .btns button {
  background: rgba(0,0,0,.05);
  border-color: rgba(0,0,0,.09);
  color: #8A857E;
}
body[data-theme="light"] .btns button:hover { background: rgba(0,0,0,.1); color: #221E1A; }
.time-row { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.time {
  font-size: 36px; font-weight: 250; letter-spacing: -0.03em; line-height: 1.1;
  font-variant-numeric: tabular-nums;
  background: linear-gradient(120deg, #FFE3B3, var(--accent) 50%, #FF8A1E);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
body.break .time {
  background: linear-gradient(120deg, #C9F7D4, var(--green-2) 50%, var(--green));
  -webkit-background-clip: text; background-clip: text;
}
.btns { display: flex; gap: 6px; opacity: 0; transition: opacity .2s; flex-shrink: 0; app-region: no-drag; -webkit-app-region: no-drag; }
body:hover .btns { opacity: 1; }
.btns button {
  width: 26px; height: 26px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.1);
  color: #C9C9CF; font-size: 12px; cursor: pointer;
  font-family: inherit;
  transition: all .15s;
  app-region: no-drag; -webkit-app-region: no-drag;
}
.btns button:hover { background: rgba(255,255,255,.15); color: #fff; }
#closeBtn:hover { background: rgba(255,69,58,.28); color: #FF6B61; border-color: transparent; }
</style>
</head>
<body>
<div class="win">
  <div class="track"><i id="fill"></i></div>
  <div class="task-row">
    <span id="taskText">等待主窗口…</span>
    <span id="dot" title="与主窗口的连接状态"></span>
  </div>
  <div class="time-row" data-tauri-drag-region>
    <div class="time" id="time">--:--</div>
    <div class="btns">
      <button id="closeBtn" title="收起悬浮窗">✕</button>
    </div>
  </div>
</div>

<script>
/* 幂等保护：防止脚本被重复执行时报重复声明 */
if (!window.__pipBooted) {
  window.__pipBooted = true;
  (function () {
'use strict';
/* 镜像模式：实时显示主窗口广播的专注状态。
   Tauri 环境用原生事件收听（零延迟）；浏览器兜底走 localhost:8520 轮询。 */
const $ = s => document.querySelector(s);
const API = 'http://localhost:8520/api/focus';
const isTauri = !!(window.__TAURI__ && window.__TAURI__.event);
let remote = null;
let offline = true;
let dispRemaining = 0, dispTotal = 1, dispMode = 'work';
let prevMode = null;

/* 完成提醒音（Web Audio，无外部文件） */
const Sound = {
  _ctx: null,
  _ensure() {
    if (!this._ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) this._ctx = new AC();
    }
    if (this._ctx && this._ctx.state === 'suspended') this._ctx.resume();
    return this._ctx;
  },
  _tone(freq, start, dur) {
    const ctx = this._ctx;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, ctx.currentTime + start);
    gain.gain.exponentialRampToValueAtTime(0.22, ctx.currentTime + start + 0.03);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + start + dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start(ctx.currentTime + start);
    osc.stop(ctx.currentTime + start + dur + 0.05);
  },
  workDone() { if (this._ensure()) { this._tone(880, 0, 0.25); this._tone(1174.7, 0.28, 0.4); } },
  breakDone() { if (this._ensure()) { this._tone(587.3, 0, 0.25); this._tone(880, 0.28, 0.4); } }
};

function fmt(s) {
  s = Math.max(0, s | 0);
  return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}

function applyState(j) {
  /* 模式翻转 = 一轮结束 → 播对应提示音 */
  if (j && prevMode && prevMode !== j.mode) {
    if (prevMode === 'work' && j.mode === 'break') Sound.workDone();
    else if (prevMode === 'break' && j.mode === 'work') Sound.breakDone();
  }
  if (j) {
    prevMode = j.mode;
    document.body.dataset.theme = j.theme === 'light' ? 'light' : 'dark';
  }
  remote = j;
  offline = !j;
  if (j) { dispTotal = j.total || 1; dispMode = j.mode; }
  renderTask();
}

function renderTask() {
  $('#dot').style.background = offline ? '#FF453A' : '#30D158';
  const el = $('#taskText');
  if (offline) { el.textContent = isTauri ? '主窗口未运行' : '主应用未连接（打开 localhost:8520）'; el.className = 'empty'; return; }
  if (remote.task) { el.textContent = (remote.mode === 'break' ? '☕ ' : '') + remote.task; el.className = ''; }
  else if (remote.mode === 'break') { el.textContent = '☕ 烤炉保温中'; el.className = ''; }
  else { el.textContent = '自由专注'; el.className = 'empty'; }
}

function loop() {
  if (!offline && remote) {
    if (remote.running && remote.tickAt) {
      dispRemaining = Math.max(0, Math.round((remote.tickAt - Date.now()) / 1000));
    } else {
      dispRemaining = remote.remaining;
    }
  }
  $('#time').textContent = offline ? '--:--' : fmt(dispRemaining);
  $('#fill').style.width = (offline ? 0 : dispRemaining / (dispTotal || 1) * 100) + '%';
  document.body.classList.toggle('break', !offline && dispMode === 'break');
  document.title = (!offline && remote && remote.running ? fmt(dispRemaining) + ' · ' : '') + '饼控悬浮窗';
}

/* ✕ = 收起悬浮窗（应用还在主窗口里跑着） */
$('#closeBtn').addEventListener('click', () => {
  if (isTauri) {
    window.__TAURI__.event.emit('toggle-pip').catch(() => {});
  } else {
    window.close();
  }
});

if (isTauri) {
  /* 收听主窗口广播（注册成功后请求一次当前状态，防竞态重试） */
  (async () => {
    try {
      await window.__TAURI__.event.listen('focus-state', (e) => {
        console.log('[pip] 收到 focus-state:', e.payload);
        applyState(e.payload);
      });
      $('#taskText').textContent = '监听已注册，等待状态…';
    } catch (err) {
      $('#taskText').textContent = '监听注册失败: ' + err;
      return;
    }
    const req = () => window.__TAURI__.event.emit('focus-request')
      .then(() => console.log('[pip] 已发 focus-request'))
      .catch((e) => console.warn('[pip] focus-request 失败:', e));
    req();
    setTimeout(req, 800);
  })();
} else {
  /* 浏览器兜底：轮询本地服务器 */
  async function poll() {
    try {
      const r = await fetch(API, { cache: 'no-store' });
      if (!r.ok) throw new Error('bad response');
      applyState(await r.json());
    } catch (e) { applyState(null); }
  }
  poll();
  setInterval(poll, 1500);
}

setInterval(loop, 500);
loop();
  })();
}
</script>
</body>
</html>
